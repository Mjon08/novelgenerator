  html.dark [class*="bg-surface"], html.dark [class*="bg-white"] { background-color: #1c1c22 !important; }
  html.dark [class*="bg-surface-container-high"] { background-color: #26262e !important; }
  html.dark h1, html.dark h2, html.dark h3, html.dark h4, html.dark h5, html.dark h6, html.dark .text-on-surface { color: #fff !important; }

<script>
// ══════════════════════════════════════════════════════════
// PERPUSTAKAAN — daftar novel hasil generate dari server
// ══════════════════════════════════════════════════════════

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Sampul dibangkitkan dari inisial judul — tanpa gambar contoh dari luar.
function kartuBuku(n) {
  const judul = escapeHtml(n.title || 'Tanpa Judul');
  const inisial = escapeHtml((n.title || '?').trim().charAt(0).toUpperCase());
  const meta = [n.genre, n.chapterCount ? `${n.chapterCount} bab` : null]
    .filter(Boolean).map(escapeHtml).join(' • ');

  return `
    <a href="editor.html?novel_id=${encodeURIComponent(n.id)}&title=${encodeURIComponent(n.title || '')}"
       class="group flex flex-col gap-3 relative cursor-pointer">
      <div class="aspect-[2/3] w-full squircle-cover shadow-[0_4px_12px_rgba(0,0,0,0.05)] relative bg-surface-container-highest transition-all duration-300 group-hover:-translate-y-1.5 group-hover:shadow-[0_12px_24px_-8px_rgba(0,91,193,0.15)] ring-1 ring-black/5">
        <div class="w-full h-full bg-gradient-to-br from-primary/20 to-primary/5 flex items-center justify-center">
          <span class="font-headline-md text-[42px] text-primary/60 group-hover:scale-110 transition-transform">${inisial}</span>
        </div>
        <div class="absolute inset-0 bg-gradient-to-tr from-white/0 via-white/10 to-white/40 pointer-events-none"></div>
        <div class="absolute inset-0 border border-white/30 rounded-[1.25rem] pointer-events-none"></div>
      </div>
      <div class="px-1">
        <h3 class="font-body-md text-body-md text-on-surface line-clamp-1 group-hover:text-primary transition-colors">${judul}</h3>
        <p class="font-label-sm text-label-sm text-on-surface-variant mt-0.5">${meta || '—'}</p>
      </div>
    </a>`;
}

const KARTU_BUKU_BARU = `
  <a href="generate.html" class="group flex flex-col gap-3 relative cursor-pointer">
    <div class="aspect-[2/3] w-full squircle-cover relative flex items-center justify-center bg-surface-container transition-all duration-300 group-hover:-translate-y-1.5 group-hover:shadow-[0_12px_24px_-8px_rgba(0,0,0,0.1)] ring-1 ring-outline-variant/30 border border-dashed border-outline/50 hover:border-primary/50 hover:bg-primary/5">
      <div class="flex flex-col items-center gap-2 text-on-surface-variant group-hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[32px] opacity-70">add_circle</span>
        <span class="font-label-md text-label-md font-semibold">Novel Baru</span>
      </div>
    </div>
    <div class="px-1 invisible"><h3 class="font-body-md text-body-md">.</h3><p class="font-label-sm text-label-sm">.</p></div>
  </a>`;

async function muatPerpustakaan() {
  const grid = document.getElementById('library-grid');
  const hitung = document.getElementById('library-count');
  if (!grid) return;

  try {
    const data = await (await fetch('/api/novels')).json();
    const daftar = Array.isArray(data) ? data : (data.novels || []);

    if (hitung) hitung.textContent = `${daftar.length} Item`;

    if (daftar.length === 0) {
      grid.innerHTML = `
        <div class="col-span-2 md:col-span-3 lg:col-span-4 xl:col-span-5 rounded-xl border border-dashed border-outline-variant/40 p-12 text-center">
          <span class="material-symbols-outlined text-[44px] text-outline mb-3 inline-block">library_books</span>
          <h3 class="font-body-md text-body-md text-on-surface mb-1">Perpustakaan masih kosong</h3>
          <p class="font-label-sm text-label-sm text-on-surface-variant mb-5">Novel yang Anda hasilkan akan muncul di sini.</p>
          <a href="generate.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:opacity-90 transition-opacity">
            <span class="material-symbols-outlined text-[18px]">auto_awesome</span> Buat Novel Pertama
          </a>
        </div>`;
      return;
    }

    grid.innerHTML = daftar.map(kartuBuku).join('') + KARTU_BUKU_BARU;
  } catch (err) {
    console.error('Gagal memuat perpustakaan:', err);
    if (hitung) hitung.textContent = '—';
    grid.innerHTML = `
      <div class="col-span-2 md:col-span-3 lg:col-span-4 xl:col-span-5 rounded-xl border border-dashed border-outline-variant/40 p-8 text-center">
        <p class="font-label-sm text-label-sm text-on-surface-variant">Gagal memuat daftar novel.</p>
      </div>`;
  }
}

document.addEventListener('DOMContentLoaded', muatPerpustakaan);
</script>
