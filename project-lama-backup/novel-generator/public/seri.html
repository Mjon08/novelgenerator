<style id="dark-mode-style">
  html.dark { color-scheme: dark; }
  /* .glass-panel dipakai untuk efek kartu glassmorphism di halaman ini, tapi
     nilai rgba-nya hardcode putih transparan — tanpa baris ini kartu tetap
     terang di mode gelap walau teks di dalamnya sudah dipaksa putih. */
  html.dark .glass-panel { background: rgba(47, 49, 50, 0.85) !important; }
  html.dark body { background-color: #0f0f12 !important; color: #f3f3f6 !important; }
  html.dark header, html.dark aside { background-color: rgba(24,24,28,0.95) !important; border-color: rgba(255,255,255,0.1) !important; }
  /* Kelas latar "surface" Tailwind (bg-surface, bg-surface/NN, bg-surface-container*,
     bg-surface-variant, bg-surface-bright) memakai warna literal terang dari
     tailwind.config, bukan CSS variable yang otomatis berubah saat mode gelap.
     Sebelumnya hanya sebagian nama kelas didaftar manual, jadi varian dengan
     modifier opacity (mis. bg-surface/60) lolos tidak ter-override dan kartu
     tetap terang dengan teks putih di atasnya — nyaris tak terbaca. Selector
     wildcard [class*="..."] menangkap SEMUA varian sekaligus. */
  html.dark [class*="bg-surface"], html.dark [class*="bg-white"] { background-color: #1c1c22 !important; }
  html.dark [class*="bg-surface-container-high"] { background-color: #26262e !important; }
  html.dark h1, html.dark h2, html.dark h3, html.dark h4, html.dark h5, html.dark h6, html.dark .text-on-surface { color: #fff !important; }
  html.dark p, html.dark span, html.dark label, html.dark li, html.dark a:not(.bg-primary) { color: #c8c8d0 !important; }
  html.dark .text-outline, html.dark .text-on-surface-variant { color: #9898a6 !important; }
  html.dark .border, html.dark .border-b, html.dark [class*="border-outline"] { border-color: rgba(255,255,255,0.1) !important; }
  html.dark input, html.dark textarea, html.dark select { background-color: #1e1e24 !important; color: #f3f3f6 !important; border-color: rgba(255,255,255,0.15) !important; }
</style>

<script>
// ══════════════════════════════════════════════════════════
// SERI — daftar & detail dari server
// ══════════════════════════════════════════════════════════

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let daftarSeri = [];
let seriTerpilih = null;

function kartuSeri(s, aktif) {
  const inisial = escapeHtml((s.judul || '?').trim().charAt(0).toUpperCase());
  const jumlahJilid = s.jumlah_jilid ?? s.jilid_count ?? 0;
  const meta = [s.genre, `${jumlahJilid} Jilid`].filter(Boolean).map(escapeHtml).join(' • ');

  return `
    <div onclick="pilihSeri(${s.id})"
         class="flex items-center gap-3 p-3 rounded-xl cursor-pointer mb-1 transition-colors ${
           aktif ? 'bg-primary/10 border border-primary/20' : 'hover:bg-surface-variant/50'}">
      <div class="w-12 h-16 rounded-md overflow-hidden shrink-0 shadow-sm bg-gradient-to-br from-primary/20 to-primary/5 flex items-center justify-center">
        <span class="font-headline-sm text-primary/60">${inisial}</span>
      </div>
      <div class="flex-1 min-w-0">
        <h3 class="font-label-md text-label-md text-on-surface truncate ${aktif ? 'font-semibold' : ''}">${escapeHtml(s.judul || 'Tanpa Judul')}</h3>
        <p class="font-mono-sm text-mono-sm text-on-surface-variant truncate">${meta}</p>
      </div>
    </div>`;
}

function tampilDetailKosong(pesan) {
  document.getElementById('seri-detail').innerHTML = `
    <div class="flex-1 flex flex-col items-center justify-center text-center p-10">
      <span class="material-symbols-outlined text-[44px] text-outline-variant mb-3">auto_stories</span>
      <h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">${escapeHtml(pesan)}</h3>
      <p class="font-body-md text-body-md text-on-surface-variant max-w-sm">
        Seri membantu mengelompokkan beberapa jilid novel dalam satu alur cerita berkelanjutan.
      </p>
    </div>`;
}

function pilihSeri(id) {
  seriTerpilih = id;
  renderDaftarSeri();

  const s = daftarSeri.find(x => x.id === id);
  if (!s) return tampilDetailKosong('Seri tidak ditemukan');

  const jumlahJilid = s.jumlah_jilid ?? s.jilid_count ?? 0;
  document.getElementById('seri-detail').innerHTML = `
    <div class="px-8 py-6 border-b border-surface-variant flex justify-between items-start bg-surface-bright/50">
      <div class="flex gap-6">
        <div class="w-32 h-44 rounded-lg shadow-md overflow-hidden border border-outline-variant/20 shrink-0 bg-gradient-to-br from-primary/20 to-primary/5 flex items-center justify-center">
          <span class="font-display-lg text-[40px] text-primary/60">${escapeHtml((s.judul || '?').charAt(0).toUpperCase())}</span>
        </div>
        <div class="flex flex-col justify-end py-2">
          <div class="inline-flex items-center gap-2 mb-2">
            ${s.genre ? `<span class="px-2 py-1 rounded bg-secondary-fixed/50 text-on-secondary-fixed text-[11px] font-bold uppercase tracking-wider">${escapeHtml(s.genre)}</span>` : ''}
            ${s.status ? `<span class="px-2 py-1 rounded bg-surface-variant text-on-surface-variant text-[11px] font-bold uppercase tracking-wider">${escapeHtml(s.status)}</span>` : ''}
          </div>
          <h1 class="font-display-lg text-[32px] font-bold text-on-surface mb-1">${escapeHtml(s.judul || 'Tanpa Judul')}</h1>
          <p class="font-body-md text-body-md text-on-surface-variant mb-4 max-w-xl">${escapeHtml(s.sinopsis || s.deskripsi || 'Belum ada sinopsis untuk seri ini.')}</p>
          <p class="font-mono-sm text-mono-sm text-on-surface-variant">${jumlahJilid} jilid</p>
        </div>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto p-8 bg-surface-container-lowest">
      <p class="font-body-md text-body-md text-on-surface-variant text-center">
        ${jumlahJilid === 0 ? 'Belum ada jilid pada seri ini.' : `Seri ini memiliki ${jumlahJilid} jilid.`}
      </p>
    </div>`;
}

function renderDaftarSeri() {
  const el = document.getElementById('seri-list');
  if (!el) return;

  if (daftarSeri.length === 0) {
    el.innerHTML = `
      <div class="p-6 text-center">
        <p class="font-label-sm text-label-sm text-on-surface-variant mb-3">Belum ada seri.</p>
        <a href="generate.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-primary text-on-primary font-label-sm text-label-sm hover:opacity-90 transition-opacity">
          <span class="material-symbols-outlined text-[16px]">add</span> Buat Seri
        </a>
      </div>`;
    return;
  }
  el.innerHTML = daftarSeri.map(s => kartuSeri(s, s.id === seriTerpilih)).join('');
}

async function muatSeri() {
  try {
    const data = await (await fetch('/api/seri/daftar')).json();
    daftarSeri = Array.isArray(data) ? data : (data.seri || data.daftar || []);
    renderDaftarSeri();

    if (daftarSeri.length === 0) {
      tampilDetailKosong('Belum ada seri');
    } else {
      pilihSeri(daftarSeri[0].id);
    }
  } catch (err) {
    console.error('Gagal memuat seri:', err);
    renderDaftarSeri();
    tampilDetailKosong('Gagal memuat seri');
  }
}

document.addEventListener('DOMContentLoaded', muatSeri);
</script>
